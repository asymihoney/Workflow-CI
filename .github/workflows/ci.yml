name: CI - MLflow Training + Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version
          ls -la

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow scikit-learn \
                      pandas numpy \
                      dagshub matplotlib

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/mlsystem-heart-disease.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Run mlflow project
        run: |
          mlflow run MLProject/ \
            --env-manager=local \
            -P n_estimators=200 \
            -P max_depth=10 \
            -P min_samples_split=2

      - name: Get latest MLflow run_id
        run: |
          python - <<'EOF'
          import mlflow, os
          mlflow.set_tracking_uri(os.environ['MLFLOW_TRACKING_URI'])
          client = mlflow.tracking.MlflowClient()
          exp = client.get_experiment_by_name("heart-disease-ci")
          runs = client.search_runs(exp.experiment_id, order_by=["start_time DESC"], max_results=1)
          print(f"Latest run_id: {runs[0].info.run_id}")
          EOF

      - name: Install Python dependencies
        run: pip install mlflow==2.19.0

      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: artifacts/

      - name: Build Docker Model
        run: |
          mlflow models build-docker \
            --model-uri "models:/heart-disease-ci/None" \
            --name "${{ secrets.DOCKER_USERNAME }}/heart-disease-model" \
            --env-manager=local || \
          mlflow models build-docker \
            --model-uri "artifacts/model" \
            --name "${{ secrets.DOCKER_USERNAME }}/heart-disease-model" \
            --env-manager=local

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest" \
                     "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:${{ github.sha }}"

      - name: Push Docker Image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:${{ github.sha }}"