name: CI - MLflow Training + Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version
          ls -la

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow scikit-learn \
                      pandas numpy \
                      dagshub matplotlib

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/mlsystem-heart-disease.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject/ \
            --env-manager=local \
            --experiment-name "heart-disease-ci" \
            -P n_estimators=200 \
            -P max_depth=10 \
            -P min_samples_split=2

      - name: Get latest MLflow run_id
        id: get_run_id
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import mlflow
          import os

          mlflow.set_tracking_uri(os.environ['MLFLOW_TRACKING_URI'])
          client = mlflow.tracking.MlflowClient()

          exp = client.get_experiment_by_name("heart-disease-ci")
          runs = client.search_runs(
              exp.experiment_id,
              order_by=["start_time DESC"],
              max_results=1
          )
          run_id = runs[0].info.run_id
          print(f"Latest run_id: {run_id}")

          # Tulis ke GITHUB_OUTPUT agar bisa dipakai step berikutnya
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"run_id={run_id}\n")
          EOF

      - name: Upload to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: artifacts/

      - name: Verify & Download model artifacts
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          RUN_ID="${{ steps.get_run_id.outputs.run_id }}"

          # Cek dulu artifacts apa saja yang ada di run ini
          python - <<'EOF'
          import mlflow, os
          client = mlflow.tracking.MlflowClient()
          run_id = os.environ.get("RUN_ID", "")

          # List semua artifacts
          artifacts = client.list_artifacts(run_id)
          print("Available artifacts:")
          for a in artifacts:
              print(f"  - {a.path} (is_dir={a.is_dir})")

          # Cek status run
          run = client.get_run(run_id)
          print(f"Run status: {run.info.status}")
          EOF

          # Download dengan retry
          for i in 1 2 3; do
            mlflow artifacts download \
              --artifact-uri "runs:/$RUN_ID/model" \
              --dst-path ./downloaded_model && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done
        env:
          RUN_ID: ${{ steps.get_run_id.outputs.run_id }}

      - name: Download model artifacts from DagsHub
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          RUN_ID="${{ steps.get_run_id.outputs.run_id }}"
          for i in 1 2 3; do
            mlflow artifacts download \
              --artifact-uri "runs:/$RUN_ID/model" \
              --dst-path ./downloaded_model && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done

      - name: Build Docker Model
        run: |
          mlflow models build-docker \
            --model-uri "./downloaded_model" \
            --name "${{ secrets.DOCKER_USERNAME }}/heart-disease-model" \
            --env-manager=local

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest" \
                     "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:${{ github.sha }}"

      - name: Push Docker Image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:${{ github.sha }}"