name: CI - MLflow Training + Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version
          ls -la

      # ── Single install step dengan versi yang konsisten ──────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mlflow==2.19.0 \
                      scikit-learn==1.5.1 \
                      pandas==2.2.2 \
                      numpy==1.26.4 \
                      dagshub \
                      matplotlib==3.9.0

      # ── Set semua env vars MLflow sekaligus ──────────────────────────────────
      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/mlsystem-heart-disease.mlflow" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV

      # ── Run training ─────────────────────────────────────────────────────────
      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject/ \
            --env-manager=local \
            --experiment-name "heart-disease-ci" \
            -P n_estimators=200 \
            -P max_depth=10 \
            -P min_samples_split=2

      # ── Get latest run_id + validasi status FINISHED ─────────────────────────
      - name: Get latest MLflow run_id
        id: get_run_id
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import mlflow
          import os
          import sys

          mlflow.set_tracking_uri(os.environ['MLFLOW_TRACKING_URI'])
          client = mlflow.tracking.MlflowClient()

          exp = client.get_experiment_by_name("heart-disease-ci")
          if exp is None:
              print("ERROR: Experiment 'heart-disease-ci' not found!")
              sys.exit(1)

          runs = client.search_runs(
              exp.experiment_id,
              order_by=["start_time DESC"],
              max_results=1
          )

          if not runs:
              print("ERROR: No runs found in experiment!")
              sys.exit(1)

          run = runs[0]
          run_id = run.info.run_id
          status = run.info.status

          print(f"Latest run_id : {run_id}")
          print(f"Run status    : {status}")

          if status != "FINISHED":
              print(f"ERROR: Run is not FINISHED (status={status}). Aborting Docker build.")
              sys.exit(1)

          # List artifacts untuk verifikasi 'model' ada
          artifacts = client.list_artifacts(run_id)
          artifact_paths = [a.path for a in artifacts]
          print(f"Available artifacts: {artifact_paths}")

          if "model" not in artifact_paths:
              print("ERROR: Artifact 'model' not found in run artifacts!")
              print(f"Found: {artifact_paths}")
              sys.exit(1)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"run_id={run_id}\n")

          print(f"\nrun_id written to GITHUB_OUTPUT: {run_id}")
          EOF

      # ── Upload artifacts hasil training ──────────────────────────────────────
      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: artifacts/

      # ── Download model dari DagsHub dengan retry ─────────────────────────────
      - name: Download model artifacts from DagsHub
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          RUN_ID: ${{ steps.get_run_id.outputs.run_id }}
        run: |
          echo "Downloading model for run_id: $RUN_ID"
          for i in 1 2 3; do
            echo "Attempt $i..."
            mlflow artifacts download \
              --artifact-uri "runs:/$RUN_ID/model" \
              --dst-path ./downloaded_model && echo "Download successful!" && break
            echo "Attempt $i failed, retrying in 30s..."
            sleep 30
          done

          # Verifikasi folder berhasil didownload
          if [ ! -d "./downloaded_model" ]; then
            echo "ERROR: downloaded_model directory not found after all retries!"
            exit 1
          fi

          echo "Downloaded model contents:"
          ls -la ./downloaded_model/

      # ── Build Docker dari local path (bukan dari DagsHub remote) ─────────────
      - name: Build Docker Model
        run: |
          MODEL_PATH=$(find ./downloaded_model -name "MLmodel" -type f | head -1 | xargs dirname)
          echo "Found MLmodel at: $MODEL_PATH"
          mlflow models build-docker \
            --model-uri "$MODEL_PATH" \
            --name "${{ secrets.DOCKER_USERNAME }}/heart-disease-model" \
            --env-manager=local

      # ── Login ke Docker Hub ───────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── Tag & Push ────────────────────────────────────────────────────────────
      - name: Tag Docker Image
        run: |
          docker tag "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest" \
                     "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:${{ github.sha }}"

      - name: Push Docker Image
        run: |
          docker push "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:${{ github.sha }}"